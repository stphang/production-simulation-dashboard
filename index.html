<!DOCTYPE html><html><head><meta charset="utf-8"><title>Production Simulation Dashboard Event Log Fixed</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:Segoe UI}.header{padding:14px;background:#111827;font-size:24px;font-weight:700}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:12px}.card,.panel{background:#1e293b;border-radius:10px;padding:10px}.v{font-size:24px;color:#38bdf8}.main{display:grid;grid-template-columns:420px 1fr;gap:12px;padding:12px}.log{height:280px;overflow:auto;background:#0b1220;padding:6px;font-size:12px}.floor{position:relative;width:1700px;height:900px;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px}.floorWrap{height:760px;overflow:auto}.conn{position:absolute;width:1700px;height:900px}.station{position:absolute;width:140px;padding:10px;background:linear-gradient(145deg,#334155,#0f172a);border:1px solid #64748b;border-radius:12px;cursor:move}.wipc{color:#38bdf8;font-weight:bold}.pcb{position:absolute;width:18px;height:18px;border-radius:50%}.normal{background:#22c55e}.fail{background:#ef4444}.repair{background:#f59e0b}.cfg-row{display:flex;justify-content:space-between;margin:4px 0}.cfg-row input{width:80px}</style></head><body><div class="header">Production Simulation Dashboard - Event Log Fixed</div><div class="kpis"><div class="card">Input<div id=i class=v>0</div></div><div class="card">Output<div id=o class=v>0</div></div><div class="card">Yield<div id=y class=v>100%</div></div><div class="card">WIP<div id=w class=v>0</div></div><div class="card">Fail<div id=f class=v>0</div></div><div class="card">UPH<div id=uph class=v>0</div></div></div><div class="main"><div><div class="panel"><button onclick='startSim()'>Start</button> <button onclick='stopSim()'>Stop</button> <button onclick='resetSim()'>Reset</button></div><div class="panel"><h3>Simulation Configuration</h3><div class='cfg-row'><label>Loader Time(s)</label><input id='cfgLoader' value='0.5'></div><div class='cfg-row'><label>SMT Time(s)</label><input id='cfgSMT' value='1'></div><div class='cfg-row'><label>AOI Time(s)</label><input id='cfgAOI' value='0.8'></div><div class='cfg-row'><label>Assembly Time(s)</label><input id='cfgAssembly' value='1'></div><div class='cfg-row'><label>ICT Time(s)</label><input id='cfgICT' value='0.8'></div><div class='cfg-row'><label>Repair Time(s)</label><input id='cfgRepair' value='1.5'></div><div class='cfg-row'><label>Pack Time(s)</label><input id='cfgPack' value='0.5'></div><hr><div class='cfg-row'><label>AOI Failure %</label><input id='cfgAOIFail' value='15'></div><div class='cfg-row'><label>ICT Failure %</label><input id='cfgICTFail' value='8'></div></div><div class='panel'><div id='log' class='log'></div></div></div><div class='panel floorWrap'><div id='floor' class='floor'><svg id='svg' class='conn'></svg></div></div></div><script>let units=[],uid=1,input=0,passCt=0,failCt=0,startTime=null,loop=null,gen=null;const st={Loader:[80,320],SMT:[280,320],AOI:[500,320],Assembly:[720,320],ICT:[940,320],Pack:[1160,320],Output:[1380,320],Repair:[760,540]};const floor=document.getElementById('floor'),svg=document.getElementById('svg');function logMsg(t){document.getElementById('log').innerHTML=new Date().toLocaleTimeString()+' '+t+'<br>'+document.getElementById('log').innerHTML;}function proc(n){return (parseFloat(document.getElementById('cfg'+n).value)||1)*1000;}Object.entries(st).forEach(([n,p])=>{const d=document.createElement('div');d.className='station';d.id=n;d.style.left=p[0]+'px';d.style.top=p[1]+'px';d.innerHTML='<b>'+n+'</b><div class=wipc id=wip_'+n+'>WIP:0</div>';floor.appendChild(d);drag(d);});function draw(){svg.innerHTML='';[['Loader','SMT'],['SMT','AOI'],['AOI','Assembly'],['Assembly','ICT'],['ICT','Pack'],['Pack','Output'],['AOI','Repair'],['Repair','ICT']].forEach(r=>{let a=document.getElementById(r[0]),b=document.getElementById(r[1]);svg.innerHTML+=`<line x1='${a.offsetLeft+70}' y1='${a.offsetTop+30}' x2='${b.offsetLeft+70}' y2='${b.offsetTop+30}' stroke='#64748b' stroke-width='5'/>`;});}function drag(el){let m=false,x,y;el.onmousedown=e=>{m=true;x=e.clientX;y=e.clientY};window.addEventListener('mousemove',e=>{if(!m)return;el.style.left=(el.offsetLeft+e.clientX-x)+'px';el.style.top=(el.offsetTop+e.clientY-y)+'px';x=e.clientX;y=e.clientY;draw()});window.addEventListener('mouseup',()=>m=false)}draw();function startSim(){if(loop)return;logMsg('[SYSTEM] Simulation Started');startTime=Date.now();gen=setInterval(()=>{const id=uid++;input++;units.push({id,node:'Loader',enter:Date.now(),wait:proc('Loader'),state:'normal'});logMsg('[CREATE] Unit '+id+' entered Loader');},300);loop=setInterval(tick,40)}function stopSim(){if(gen)clearInterval(gen);if(loop)clearInterval(loop);gen=loop=null;logMsg('[SYSTEM] Simulation Stopped')}function resetSim(){stopSim();units.forEach(u=>u.el&&u.el.remove());units=[];uid=1;input=0;passCt=0;failCt=0;document.getElementById('log').innerHTML='';update();logMsg('[SYSTEM] Simulation Reset')}function nextNode(u){if(u.node==='Loader')return'SMT';if(u.node==='SMT')return'AOI';if(u.node==='AOI'){if(Math.random()<cfgAOIFail.value/100){failCt++;u.state='fail';logMsg('[FAIL] Unit '+u.id+' FAILED AOI -> Repair');return 'Repair';}logMsg('[PASS] Unit '+u.id+' PASSED AOI');return'Assembly';}if(u.node==='Assembly')return'ICT';if(u.node==='ICT'){if(Math.random()<cfgICTFail.value/100){failCt++;u.state='fail';logMsg('[FAIL] Unit '+u.id+' FAILED ICT -> Repair');return 'Repair';}logMsg('[PASS] Unit '+u.id+' PASSED ICT');return'Pack';}if(u.node==='Repair'){u.state='repair';return'ICT';}if(u.node==='Pack')return'Output';}function tick(){units.forEach(u=>{if(!u.target&&Date.now()-u.enter<u.wait)return;if(!u.target){u.target=nextNode(u);u.prog=0;}if(!u.el){u.el=document.createElement('div');floor.appendChild(u.el);}let a=document.getElementById(u.node),b=document.getElementById(u.target);u.prog+=0.05;u.el.className='pcb '+(u.state==='fail'?'fail':u.state==='repair'?'repair':'normal');u.el.style.left=(a.offsetLeft+(b.offsetLeft-a.offsetLeft)*u.prog)+'px';u.el.style.top=(a.offsetTop+(b.offsetTop-a.offsetTop)*u.prog)+'px';if(u.prog>=1){u.node=u.target;u.target=null;logMsg('[MOVE] Unit '+u.id+' entered '+u.node);if(u.node==='Repair')logMsg('[REPAIR] Unit '+u.id+' entered Repair');u.enter=Date.now();u.wait=u.node==='Output'?0:proc(u.node);if(u.node==='Output'){passCt++;logMsg('[COMPLETE] Unit '+u.id+' completed production');u.done=true;u.el.remove();}}});units=units.filter(x=>!x.done);update()}function update(){Object.keys(st).forEach(n=>{document.getElementById('wip_'+n).textContent='WIP:'+units.filter(u=>u.node===n).length});i.textContent=input;o.textContent=passCt;f.textContent=failCt;w.textContent=units.length;y.textContent=((passCt/Math.max(1,passCt+failCt))*100).toFixed(1)+'%';uph.textContent=startTime?Math.round(passCt/Math.max((Date.now()-startTime)/3600000,1/3600)):0;}update();</script></body></html>
