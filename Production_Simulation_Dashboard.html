<!DOCTYPE html><html><head><meta charset="utf-8"><title>Production Simulation Dashboard</title><style>
body{margin:0;background:#0f172a;color:#fff;font-family:Segoe UI} .header{background:#111827;padding:14px 20px;font-size:24px;font-weight:700}
.wrap{padding:12px}.toolbar button{background:#2563eb;color:#fff;border:0;padding:8px 12px;border-radius:6px;margin-right:5px}
.main{display:grid;grid-template-columns:500px 1fr;gap:12px}.panel{background:#1e293b;border-radius:10px;padding:10px}
.configTable{width:100%;border-collapse:collapse;background:#2b2b2b}.configTable th,.configTable td{border:1px solid #444;padding:8px}.configTable input{width:95%}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}.card{background:#1e293b;padding:10px;border-radius:10px}.v{font-size:26px;color:#38bdf8}
.tooltip{position:absolute;display:none;background:#111827;border:1px solid #475569;padding:8px;border-radius:8px;pointer-events:none}.log{height:180px;overflow:auto;background:#0b1220;padding:6px}
</style></head><body><div class='header'>Production Simulation Dashboard</div><div class='wrap'>
<div class='kpis'><div class='card'>Input<div id=i class=v>0</div></div><div class='card'>Output<div id=o class=v>0</div></div><div class='card'>Yield<div id=y class=v>100%</div></div><div class='card'>WIP<div id=w class=v>0</div></div><div class='card'>Fail<div id=f class=v>0</div></div><div class='card'>UPH<div id=uph class=v>0</div></div></div>
<div class='main'><div><div class='panel'><h3>Station Configuration</h3><table class='configTable'><thead><tr><th>Station</th><th>Proc(ms)</th><th>Fail Rate</th></tr></thead><tbody id='cfg'></tbody></table><br><button onclick='startSim()'>Start</button> <button onclick='stopSim()'>Stop</button></div><div class='panel' style='margin-top:10px'><h3>Event Log</h3><div id='log' class='log'></div></div></div><div><div class='panel toolbar'><button onclick='zoomIn()'>🔍+</button><button onclick='zoomOut()'>🔍-</button><button onclick='resetZoom()'>🎯 Reset</button> Zoom:<span id='zoomLevel'>100%</span></div><div class='panel'><canvas id='cv' width='1400' height='700'></canvas></div></div></div></div><div id='tt' class='tooltip'></div>
<script>
const stations=[{n:'Loader',x:80,y:320,t:0},{n:'SMT',x:260,y:320,t:3000},{n:'AOI',x:480,y:320,t:2500,fr:.15,inspect:true},{n:'Assembly',x:700,y:320,t:4000},{n:'ICT',x:920,y:320,t:2500,fr:.08,inspect:true},{n:'Pack',x:1140,y:320,t:2000},{n:'Output',x:1320,y:320,t:0},{n:'Repair',x:700,y:520,t:5000,repair:true}];
let units=[],uid=1,input=0,pass=0,fail=0,loop,gen,start,scale=1,offsetX=0,offsetY=0,drag=false,lx=0,ly=0;
const ctx=cv.getContext('2d');
stations.forEach((s,i)=>{if(i==0||i==6)return;cfg.innerHTML+=`<tr><td>${s.n}</td><td><input value='${s.t}' onchange='stations[${i}].t=+this.value'></td><td>${s.inspect?`<input value='${s.fr}' onchange='stations[${i}].fr=+this.value'>`:''}</td></tr>`});
function l(m){log.innerHTML=new Date().toLocaleTimeString()+' '+m+'<br>'+log.innerHTML}
function startSim(){if(loop)return;start=Date.now();gen=setInterval(()=>{input++;units.push({s:0,m:true,p:0,id:uid++})},1200);loop=setInterval(tick,40)}
function stopSim(){clearInterval(loop);clearInterval(gen);loop=null}
function tick(){units.forEach(u=>{if(u.done)return;let s=stations[u.s];if(u.m){u.p+=.015;if(u.p>=1){u.p=0;u.m=false;u.ts=Date.now()}}else if(Date.now()-u.ts>=s.t){u.m=true;if(u.s==2&&Math.random()<stations[2].fr){fail++;u.s=7}else if(u.s==4&&Math.random()<stations[4].fr){fail++;u.s=7}else if(u.s==7){u.s=4}else{u.s++;if(u.s>=6){pass++;u.done=true}}}});units=units.filter(x=>!x.done);draw();upd()}
function pos(u){let c=stations[u.s],n=stations[Math.min(6,u.s+1)];if(u.s==7)n=stations[4];return u.m?{x:c.x+(n.x-c.x)*u.p,y:c.y+(n.y-c.y)*u.p}:{x:c.x,y:c.y}}
function draw(){ctx.clearRect(0,0,1400,700);ctx.save();ctx.setTransform(scale,0,0,scale,offsetX,offsetY);ctx.strokeStyle='#64748b';ctx.lineWidth=8;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(stations[i].x,stations[i].y);ctx.lineTo(stations[i+1].x,stations[i+1].y);ctx.stroke()}ctx.strokeStyle='orange';ctx.beginPath();ctx.moveTo(480,320);ctx.lineTo(700,520);ctx.lineTo(920,320);ctx.stroke();stations.forEach((s,idx)=>{let w=units.filter(u=>u.s==idx).length;let st=s.repair?'REPAIR':(w?'RUNNING':'WAITING');ctx.fillStyle=s.inspect?'#0284c7':s.repair?'#f59e0b':'#16a34a';ctx.fillRect(s.x-60,s.y-35,120,80);ctx.fillStyle=st=='RUNNING'?'#22c55e':st=='WAITING'?'#eab308':'#f59e0b';ctx.beginPath();ctx.arc(s.x+45,s.y-20,8,0,7);ctx.fill();ctx.fillStyle='white';ctx.fillText(s.n,s.x-30,s.y);ctx.fillText('WIP:'+w,s.x-30,s.y+20);});units.forEach(u=>{let p=pos(u);ctx.fillStyle='#22c55e';ctx.fillRect(p.x-12,p.y-8,24,16)});ctx.restore()}
function upd(){i.textContent=input;o.textContent=pass;f.textContent=fail;w.textContent=units.length;y.textContent=((pass/Math.max(1,pass+fail))*100).toFixed(1)+'%';uph.textContent=Math.round(pass/Math.max((Date.now()-start)/3600000,1/3600))}
function zoomIn(){scale=Math.min(3,scale+.1);zoomLevel.textContent=Math.round(scale*100)+'%'} function zoomOut(){scale=Math.max(.5,scale-.1);zoomLevel.textContent=Math.round(scale*100)+'%'} function resetZoom(){scale=1;offsetX=0;offsetY=0;zoomLevel.textContent='100%'}
cv.addEventListener('wheel',e=>{e.preventDefault();e.deltaY<0?zoomIn():zoomOut()});cv.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY});window.addEventListener('mouseup',()=>drag=false);cv.addEventListener('mousemove',e=>{if(drag){offsetX+=e.clientX-lx;offsetY+=e.clientY-ly;lx=e.clientX;ly=e.clientY;} let r=cv.getBoundingClientRect(),mx=(e.clientX-r.left-offsetX)/scale,my=(e.clientY-r.top-offsetY)/scale,fnd=false;stations.forEach((s,idx)=>{if(mx>=s.x-60&&mx<=s.x+60&&my>=s.y-35&&my<=s.y+45){tt.style.display='block';tt.style.left=e.pageX+15+'px';tt.style.top=e.pageY+15+'px';tt.innerHTML='<b>'+s.n+'</b><br>Process:'+s.t+' ms<br>WIP:'+units.filter(u=>u.s==idx).length;fnd=true;}});if(!fnd)tt.style.display='none';}); draw();
</script></body></html>
